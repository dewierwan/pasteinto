<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Backstop if pasted HTML ever reaches the page: no inline or remote scripts. Inline styles stay allowed for the Docs and email previews. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; connect-src https://gateway.umami.is; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Paste Into: Markdown, email and Slack, Docs, WhatsApp or plain text</title>
  <meta name="description" content="Paste from Google Docs, Notion, Word, Claude or anywhere. Get Markdown, email and Slack text, rich text, WhatsApp text or plain text, auto-copied to your clipboard.">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/iAWriterMonoS-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css?v=3900f3b2">
  <script src="js/extension.js?v=a0886e2a"></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Paste anything. Get <span id="outputNoun">markdown</span>.</h1>
    </header>

    <div class="controls">
      <div class="control-row">
        <span class="control-label" id="fromLabel">From</span>
        <div id="readPills" class="pills pills-from" role="group" aria-labelledby="fromLabel" aria-disabled="true">
          <button type="button" class="pill" data-read="markdown" disabled>Markdown</button>
          <button type="button" class="pill" data-read="rich" disabled>Rich text</button>
          <button type="button" class="pill" data-read="text" disabled>Plain text</button>
          <button type="button" class="pill" data-read="pdf" disabled>PDF</button>
        </div>
        <span id="sourceHint" class="hint"></span>
      </div>
      <div class="control-row">
        <span class="control-label" id="toLabel">To</span>
        <div class="pills" role="group" aria-labelledby="toLabel">
          <button type="button" class="pill" data-output="markdown">Markdown</button>
          <button type="button" class="pill" data-output="email">Email &amp; Slack</button>
          <button type="button" class="pill" data-output="rich">Docs</button>
          <button type="button" class="pill" data-output="whatsapp">WhatsApp</button>
          <button type="button" class="pill" data-output="plain">Plain text</button>
        </div>
        <span id="outputHint" class="hint"></span>
      </div>
    </div>

    <div class="container">
      <section class="box output-box">
        <div class="section-header">
          <span id="copyFlash" class="copy-flash" role="status"></span>
        </div>
        <div class="card">
          <div id="output" class="output-content"></div>
        </div>
      </section>
    </div>

    <footer class="page-footer">
      <span>Nothing you paste leaves your browser. Usage is counted anonymously. <a href="https://github.com/dewierwan/pasteinto/issues/new">Provide feedback</a>.<span class="site-only"> <a href="https://chromewebstore.google.com/detail/paste-into/cafcglpffcdbmioicikgpiobcpfpkcge">Chrome extension</a>.</span><span class="extension-only"> <a href="https://pasteinto.com/">Website</a>.</span></span>
    </footer>
  </main>

  <script src="js/vendor/marked.umd.js?v=21568877"></script>
  <script src="js/util.js?v=515a5bbb"></script>
  <script src="js/clean-html.js?v=aa98fb78"></script>
  <script src="js/to-markdown.js?v=34d31dc1"></script>
  <script src="js/to-text.js?v=4de8b073"></script>
  <script src="js/from-slack.js?v=32c159f6"></script>
  <script src="js/sources.js?v=a0b5a02b"></script>
  <script src="js/from-pdf.js?v=8daec111"></script>
  <script src="js/convert.js?v=6dbbcb1d"></script>
  <script src="js/analytics.js?v=92c5be23"></script>
  <script src="js/app.js?v=d9205533"></script>
</body>
</html>
